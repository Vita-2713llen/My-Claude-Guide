# Rank Math SEO (free; Pro uses the same slug + seo-by-rank-math-pro, tables are shared).
# Post/term meta (rank_math_title, rank_math_description, rank_math_focus_keyword…) lives in postmeta/termmeta
# and moves with the content. Settings (rank-math-options-*) are in options and come with full.
# Check the names on your site: wp db tables '*rank_math*' --all-tables-with-prefix

# Redirects are content: they are set up locally and moved (incl. --mode=content).
CONTENT_EXTRA_TABLES="$CONTENT_EXTRA_TABLES rank_math_redirections rank_math_redirections_cache"

# Logs and analytics are per-environment data: the target keeps its own.
KEEP_TABLES="$KEEP_TABLES rank_math_404_logs rank_math_analytics_gsc rank_math_analytics_objects rank_math_analytics_inspections rank_math_analytics_keyword_manager rank_math_analytics_ga rank_math_analytics_adsense"

# Rank Math account and Google (Search Console/Analytics) connections — each environment has its own.
PRESERVE_OPTIONS="$PRESERVE_OPTIONS rank_math_connect_data rank_math_google_* rank_math_analytics_all_services"

# Indexing: DEV must not get into Google — blog_public handles that (already in PRESERVE_OPTIONS in sync.conf),
# and Rank Math respects it (robots noindex, sitemap is not pinged).
