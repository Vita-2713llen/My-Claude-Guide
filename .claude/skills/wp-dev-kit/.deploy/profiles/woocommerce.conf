# WooCommerce (+ HPOS, Subscriptions, Stripe/PayPal/WooPayments)
# Products, categories, attributes are CONTENT. Orders, customers, sessions, tokens are TRANSACTIONAL.

CONTENT_EXTRA_TABLES="$CONTENT_EXTRA_TABLES woocommerce_attribute_taxonomies wc_product_meta_lookup wc_product_attributes_lookup"
# Shop/cart/checkout pages are tied to page IDs — they move together with the pages.
CONTENT_OPTIONS="$CONTENT_OPTIONS woocommerce_*_page_id"

KEEP_TABLES="$KEEP_TABLES
  wc_orders wc_orders_meta wc_order_addresses wc_order_operational_data
  woocommerce_order_items woocommerce_order_itemmeta
  wc_order_stats wc_order_product_lookup wc_order_tax_lookup wc_order_coupon_lookup
  wc_customer_lookup wc_download_log woocommerce_downloadable_product_permissions
  woocommerce_payment_tokens woocommerce_payment_tokenmeta
  woocommerce_sessions woocommerce_api_keys wc_webhooks wc_reserved_stock wc_rate_limits"
# Remove shop_coupon if coupons are prepared by the developer, not the client.
KEEP_ID_TABLES="$KEEP_ID_TABLES wc_orders:id"
KEEP_POST_TYPES="$KEEP_POST_TYPES shop_order shop_order_refund shop_order_placehold shop_subscription shop_coupon"

# Payment and webhook keys are per environment (test keys on DEV!).
PRESERVE_OPTIONS="$PRESERVE_OPTIONS woocommerce_stripe* woocommerce_ppcp* woocommerce-ppcp* woocommerce_paypal* woocommerce_square* woocommerce_woocommerce_payments* wcpay_* woocommerce_api_* wc_stripe_*"
# Where the target's own orders live (HPOS tables or posts): must not be flipped by the source's setting,
# or the kept orders disappear from the admin.
PRESERVE_OPTIONS="$PRESERVE_OPTIONS woocommerce_custom_orders_table_enabled woocommerce_custom_orders_table_data_sync_enabled"

if dst_has woocommerce; then
  add_hook '*' 'eval "function_exists(\"wc_update_product_lookup_tables\") && wc_update_product_lookup_tables();"'
fi
