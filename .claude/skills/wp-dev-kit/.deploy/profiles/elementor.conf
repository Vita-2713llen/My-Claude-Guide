# Elementor: the global Kit is a post; its ID in the elementor_active_kit option must move with the content.
# Elementor Pro form submissions are TRANSACTIONAL.
# Elementor Pro Theme Builder: which header/footer/single template applies where (by post ID) — moves with the posts.
CONTENT_OPTIONS="$CONTENT_OPTIONS elementor_active_kit elementor_pro_theme_builder_conditions"
KEEP_TABLES="$KEEP_TABLES e_submissions e_submissions_values e_submissions_actions_log"
PRESERVE_OPTIONS="$PRESERVE_OPTIONS elementor_pro_license_key _elementor_pro_license_*"
if dst_has elementor; then
  add_hook '*' 'elementor flush-css'
fi
