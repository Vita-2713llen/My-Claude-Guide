# Server access for the data scripts (bin/db-sync.sh, bin/files-sync.sh, bin/setup.sh).
# The team lead fills it in ONCE and commits it — developers do not need to enter anything.
# No passwords or keys here: only an address and a path. Personal overrides go in wp-content/.env.
#
# Where to find it (Cloudways → application → Access Details → Application Credentials):
#   DEV_SSH  = <username>@<Public IP>
#   DEV_PATH = absolute path to public_html (log in over SSH, cd public_html, pwd)

# Git branches that deploy (set once; GitHub Actions reads them from here):
#   DEV_BRANCH  — push to it → code on DEV (e.g. develop, dev, main, master)
#   PROD_BRANCH — push to it → code on PROD; empty while there is no PROD
DEV_BRANCH="main"
PROD_BRANCH=""

DEV_SSH="app_user@123.45.67.89"
DEV_PATH="/home/123456.cloudwaysapps.com/abcdefghij/public_html"
# DEV_URL="https://dev.example.com"   # optional, otherwise taken from `wp option get home`

# The lowest PHP version across all environments (every developer's Local, DEV, PROD). Versions may differ:
# GitHub Actions checks syntax and installs composer dependencies on exactly this version, so code
# that passed CI works on any PHP from PHP_MIN up. bin/setup.sh warns about a mismatch.
PHP_MIN="8.2"

# Data scripts may write only to local and dev. Other writable environments (never prod), e.g. "staging":
# WRITABLE_ENVS="staging"

# PROD — only as a source (pull). Scripts are blocked from writing to prod.
# PROD_SSH="app_user@98.76.54.32"
# PROD_PATH="/home/654321.cloudwaysapps.com/klmnopqrst/public_html"
