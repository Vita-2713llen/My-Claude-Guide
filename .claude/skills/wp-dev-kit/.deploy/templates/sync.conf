# DB and file sync settings (committed to the repo, no secrets here).
# Table names are WITHOUT the prefix. Option patterns: * = any characters.
#
# Kinds of data:
#   CONTENT        — pages, posts, ACF, menus, forms. Can move in both directions.
#   TRANSACTIONAL  — orders, form entries, logs, job queues. They live where they were created:
#                    not moved by default (only with --with-transactional).
#   USERS          — not moved (only with --with-users).
#   SETTINGS       — environment options (API keys, SMTP, payments). Survive a full import.
#
# Plugin specifics (WooCommerce, Gravity Forms, CF7…) are in .deploy/profiles/<slug>.conf.
# A profile loads automatically if the plugin is active on the source or the target.

# ── CONTENT (--mode=content) ─────────────────────────────────────────
CONTENT_TABLES="posts postmeta terms termmeta term_taxonomy term_relationships"
CONTENT_EXTRA_TABLES=""
# Options moved together with content (ACF Options Pages, Customizer, widgets, front page).
# Options that point at post IDs (logo, site icon, privacy page, sticky posts) must move with the posts.
CONTENT_OPTIONS="options_* _options_* theme_mods_* sidebars_widgets widget_* show_on_front page_on_front page_for_posts nav_menu_options
  site_logo site_icon wp_page_for_privacy_policy sticky_posts"

# ── TRANSACTIONAL ─────────────────────────────────────────────────────
# Tables that by default are NOT moved in either direction (only with --with-transactional).
KEEP_TABLES="actionscheduler_actions actionscheduler_claims actionscheduler_groups actionscheduler_logs"
# Post types the target keeps for itself (orders, form messages…). Extended by profiles.
KEEP_POST_TYPES=""
# Transactional tables whose IDs come from wp_posts (format table:column) — for the conflict check.
KEEP_ID_TABLES=""

# ── ENVIRONMENT SETTINGS (--mode=full) ────────────────────────────────
PRESERVE_OPTIONS="blog_public admin_email new_admin_email users_can_register default_role wp_mail_smtp* fluentmail* post_smtp* acf_pro_license*"

# ── ID gap on the server ──────────────────────────────────────────────
# After every push to a server, new posts/comments there (orders, entries, notes)
# get ID = largest content ID + POST_ID_GAP. Pages created later on
# local will not collide with them. 0 = off.
POST_ID_GAP=1000000

# ── Server-only plugins ───────────────────────────────────────────────
# Deactivated on local after import; on a server they are re-activated if they were active before the import
# (because active_plugins comes from local, where they are off).
SERVER_ONLY_PLUGINS="breeze malcare-security wordfence wp-rocket litespeed-cache object-cache-pro redis-cache"

# How many latest DB backups to keep on each target (disk on Cloudways is limited)
BACKUP_KEEP=10

# ── Hooks after DB import ─────────────────────────────────────────────
# add_hook <environment|*> '<wp command without "wp">'   — runs on the TARGET environment.
# add_hook dev 'rewrite flush'

# ── Files (bin/files-sync.sh) ─────────────────────────────────────────
# Excluded from uploads only (plugins/themes are copied whole). A leading / = at the top of uploads/.
FILES_EXCLUDE="/cache/ /wpo-cache/ /backwpup-* /ai1wm-backups/ /wp-migrate-db/ /wc-logs/ *.log"
# Also excluded when pushing uploads to a server (private entry files, generated CSS)
FILES_PUSH_EXCLUDE="/gravity_forms/ /wpforms/ /elementor/css/"
