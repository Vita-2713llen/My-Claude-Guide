# What belongs to the kit (wp-dev-kit). Shared by bin/kit-install.sh and bin/kit-pack.sh.

# Kit files: OVERWRITTEN on install/update (the project's other files next to them are not deleted).
KIT_FILES="bin .claude/skills .claude/settings.json .github/workflows/deploy.yml
.deploy/profiles .deploy/rsync-exclude .deploy/server .deploy/templates .deploy/KIT_VERSION
mu-plugins/environment-guard.php README.md CLAUDE.md .env.example"

# Project files: created from .deploy/templates only if they do not exist yet. Never overwritten.
# Format: <template>:<file in the project>
KIT_PROTECTED="gitignore:.gitignore targets:.deploy/targets environments.conf:.deploy/environments.conf sync.conf:.deploy/sync.conf"
